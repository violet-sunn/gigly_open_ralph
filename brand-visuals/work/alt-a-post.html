<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>

  .round { position: absolute; left: 150px; top: 150px; width: 780px; height: 780px; transform: rotate(-12deg); mix-blend-mode: multiply; opacity: 0.9; }
  .rect { position: absolute; right: 70px; bottom: 90px; transform: rotate(-6deg); border: 6px solid var(--red); color: var(--red); padding: 8px 22px 4px; font-family: 'Bahnschrift'; font-stretch: 75%; font-weight: 800; font-size: 84px; line-height: 0.9; letter-spacing: 0.04em; mix-blend-mode: multiply; opacity: 0.9; }
</style></head>
