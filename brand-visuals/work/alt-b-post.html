  .url { position: absolute; right: 64px; top: 58px; font-size: 24px; font-weight: 600; }
  .w { font-family: 'Bahnschrift'; font-stretch: 75%; font-weight: 800; text-transform: uppercase; font-size: 220px; line-height: 0.86; white-space: nowrap; letter-spacing: -0.01em; }
  .n { font-size: 40px; font-weight: 600; line-height: 1.25; margin-bottom: 28px; max-width: 760px; }
</style></head>
<body><div class="frame">
  <div class="mark">GIGLY</div>

</div></body></html>
