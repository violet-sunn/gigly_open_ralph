<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-radius:16px; background:{{ gig.radial }}; box-shadow:inset 0 0 0 1px {{ gig.borderColor }}; display:flex; flex-direction:column;">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:12px;">
    <div style="display:flex; align-items:center; gap:8px; flex:none;">
      <span style="width:8px; height:8px; flex:none; border-radius:50%; background:{{ gig.statusDot }};"></span>
      <span style="font-family:'Handjet',monospace; font-size:15px; color:{{ gig.statusDot }}; white-space:nowrap;">{{ gig.statusLabel }}</span>
    </div>
    <span style="font-family:'Handjet',monospace; font-size:12px; color:var(--text-3); flex:none; white-space:nowrap;">{{ gig.time }}</span>
  </div>
  <div style="border-radius:16px; background:var(--surface-card); box-shadow:inset 0 0 0 1px var(--hairline-08), inset 0 1px 0 var(--hairline-06); padding:16px; display:flex; flex-direction:column; gap:10px;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
      <div style="display:flex; align-items:center; gap:8px; min-width:0;">
        <span style="width:22px; height:22px; flex:none; border-radius:50%; background:{{ gig.avatarBg }}; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff;">{{ gig.initial }}</span>
        <span style="font-size:13px; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ gig.company }}</span>
        <span style="color:var(--om-accent, #0088ff); display:flex; flex:none;"><x-import component-from-global-scope="IconBootstrapOutlineLogosPatch" from="./design-system/Components.bundle.js" hint-size="13px,13px"></x-import></span>
        <span style="color:var(--text-5); font-size:11px; letter-spacing:1px; flex:none;">★★★★★</span>
        <span style="color:var(--text-4); font-size:11px; flex:none;">45</span>
      </div>
      <span style="flex:none; font-size:12px; color:{{ gig.catColor }}; border:1px solid {{ gig.catBorder }}; border-radius:6px; padding:2px 8px;">{{ gig.category }}</span>
    </div>
    <span style="font-weight:600; font-size:17px; line-height:21px; color:var(--text-1);">{{ gig.title }}</span>
    <div style="display:flex; gap:5px; flex-wrap:wrap;">
      <sc-for list="{{ gig.tags }}" as="tg" hint-placeholder-count="3">
        <span style="font-size:12px; color:var(--accent-ink, #4ea3ff); background:rgba(0,136,255,0.1); border-radius:6px; padding:3px 8px;">{{ tg.text }}</span>
      </sc-for>
    </div>
    <span style="font-size:14px; line-height:18px; color:var(--text-3); opacity:0.85; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;">{{ gig.desc }}</span>
    <div style="display:flex; align-items:center; gap:12px; margin-top:2px;">
      <span style="font-family:'Handjet',monospace; font-size:12px; color:var(--text-3);">{{ gig.dateStart }}</span>
      <div style="flex:1; height:4px; border-radius:3px; background:rgba(159,160,164,0.4); overflow:hidden;"><div style="height:100%; border-radius:3px; background:var(--text-3); width:{{ gig.progress }};"></div></div>
      <span style="font-family:'Handjet',monospace; font-size:12px; color:var(--text-3);">{{ gig.dateEnd }}</span>
    </div>
  </div>
  <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; align-items:flex-end; gap:16px; padding:14px 20px;">
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <span style="font-size:11px; letter-spacing:0.2px; color:var(--text-3);">Фикс. цена</span>
        <span style="font-weight:600; font-size:15px; color:var(--text-1);">{{ gig.price }}</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <span style="font-size:11px; letter-spacing:0.2px; color:var(--text-3);">Срок выполнения</span>
        <span style="font-weight:600; font-size:15px; color:var(--text-1);">{{ gig.duration }}</span>
      </div>
      <button onClick="{{ gig.open }}" style="flex:none; height:40px; padding:0 22px; border:none; border-radius:8px; background:var(--om-accent, #0088ff); color:#fff; font-size:14px; font-weight:500; cursor:pointer;">К проекту</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 380, &quot;height&quot;: 340}, &quot;gig&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}, &quot;full&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}"></script>
</body>
</html>
